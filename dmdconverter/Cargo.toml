[package]
name = "dmdconverter"
version = "0.1.0"
edition = "2021"
description = "Stamps the DMD rectangle into B2S backglass XML files (.directb2s / .b2spro)"

[dependencies]
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
encoding_rs = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
quick-xml = "0.41"
regex = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vpin = { version = "0.39", default-features = false }

[profile.release]
lto = "thin"
